name: build (macos)

# Tag pushes of the form v0.6.0 build a release: the version is taken from
# the tag, stamped into package-info.json, and the zipped package is attached
# to a GitHub release with the same name. Manual runs only build and upload
# an artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_macos:
    name: build macos externals (universal)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: configure
      run: cmake --preset macos

    - name: build
      run: cmake --build --preset macos-release

    - name: stamp version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        jq --arg v "$VERSION" '.version=$v' package-info.json > package-info.tmp
        mv package-info.tmp package-info.json

    - name: zip package
      run: |
        mkdir mlmat
        mv ./examples ./mlmat
        mv ./extras ./mlmat
        mv ./externals ./mlmat
        mv ./help ./mlmat
        mv ./init ./mlmat
        mv ./javascript ./mlmat
        mv ./misc ./mlmat
        mv ./patchers ./mlmat
        mv ./LICENSE ./mlmat
        mv ./README.md ./mlmat
        mv ./BUILD.md ./mlmat
        mv ./package-info.json ./mlmat
        zip -r mlmat.zip mlmat

    - name: upload artifact (manual runs)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: mlmat-macos
        path: mlmat.zip

    - name: create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: mlmat.zip
        token: ${{ secrets.THIS_REPO }}
