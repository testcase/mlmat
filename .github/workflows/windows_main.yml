name: build (windows)

# Tag pushes of the form v0.6.0 build a release: the version is taken from
# the tag, stamped into package-info.json, and the zipped package is
# attached (together with the macOS build) to a GitHub release with the same
# name. Manual runs only build and upload an artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_windows:
    name: build windows externals (x64)
    # windows-latest now ships Visual Studio 2025 only; the preset's
    # generator is "Visual Studio 17 2022", so pin the image that has it
    permissions:
      contents: write    # create the release and upload zips
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # vcpkg binary caching through the GitHub Actions cache: the first
    # run builds OpenBLAS/clapack and uploads the package binaries
    # (~17 min); every later run restores them in a minute or two.
    # The x-gha provider needs the runner's cache credentials exported
    # into the environment first.
    - name: export vcpkg cache credentials
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    # GitHub runners ship vcpkg; the build consumes it in manifest mode
    # (vcpkg.json) through the toolchain file referenced by the preset.
    # VCPKG_INSTALLATION_ROOT is a runner process variable: read it in the
    # shell, not through the ${{ env.* }} context (which is expanded
    # before the runner image variables are visible and resolves empty).
    - name: configure
      env:
        VCPKG_BINARY_SOURCES: clear;x-gha,read,write
      run: |
        $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
        cmake --preset windows

    - name: build
      env:
        VCPKG_BINARY_SOURCES: clear;x-gha,read,write
      run: |
        $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
        cmake --build --preset windows-release

    - name: test
      run: ctest --test-dir build -C Release --output-on-failure

    - name: stamp version from tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
        (Get-Content package-info.json) `
          -replace '"version"\s*:\s*"[^"]*"', ('"version" : "' + $version + '"') |
          Set-Content package-info.json

    - name: zip package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Name mlmat | Out-Null
        $items = "examples", "extras", "externals", "docs", "help", "init",
                 "javascript", "misc", "patchers", "LICENSE", "README.md",
                 "BUILD.md", "package-info.json"
        foreach ($item in $items) {
          Move-Item -Path $item -Destination mlmat
        }
        Compress-Archive -Path mlmat -DestinationPath mlmat_windows.zip

    - name: upload artifact (manual runs)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: mlmat-windows
        path: mlmat_windows.zip

    - name: create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: mlmat_windows.zip
        token: ${{ secrets.GITHUB_TOKEN }}
